<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body {
    font: 12.5px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    /* Enough of a veil to say the page is not yours right now, little enough
       to keep watching what the agent does to it. */
    background: rgba(12, 12, 14, 0.07);
    box-shadow: inset 0 0 0 1px rgba(181, 140, 246, 0.35);
    cursor: default;
  }
  .bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    padding: 6px 6px 6px 14px; border-radius: 999px;
    background: rgba(23, 23, 27, 0.88); color: #c9c9d1;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(8px); white-space: nowrap;
  }
  .who { max-width: 38ch; overflow: hidden; text-overflow: ellipsis; }
  button {
    display: inline-flex; align-items: center; gap: 6px;
    border: 0; border-radius: 999px; padding: 7px 12px;
    background: #f4f4f5; color: #18181b; font: 600 12.5px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    cursor: pointer;
  }
  button:hover { background: #ffffff; }
  button:focus-visible { outline: 2px solid #b58cf6; outline-offset: 2px; }
  svg { width: 14px; height: 14px; flex: none; }
  .nudge { animation: nudge 360ms ease-out; }
  @keyframes nudge { 30% { transform: translateX(-50%) scale(1.06); } 100% { transform: translateX(-50%) scale(1); } }
  @media (prefers-reduced-motion: reduce) { .nudge { animation: none; } }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <span class="who" id="who">The agent is using this page</span>
    <button id="take" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/>
      </svg>
      Take control
    </button>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
